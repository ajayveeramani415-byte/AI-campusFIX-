<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — CampusFix AI</title><style>body{font-family:system-ui;background:#101b36;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:34px;border-radius:20px;width:min(390px,88%);box-shadow:0 15px 50px #0004}input,button{width:100%;padding:13px;margin-top:12px;box-sizing:border-box;border-radius:10px;font:inherit}input{border:1px solid #ddd}button{border:0;background:#111f46;color:#fff;font-weight:700}.secure{font-size:13px;color:#64748b}.link{display:block;text-align:center;margin-top:16px;color:#2563eb}.msg{min-height:20px;color:#475569}</style></head><body><main class="box"><h1>🔐 Administrator Login</h1><p class="secure">Use the authorized administrator email. Only the project owner/admin can access complaint management.</p><form id="adminForm"><input id="adminEmail" type="email" autocomplete="email" placeholder="Administrator email" required><input id="adminCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code" hidden><button id="adminBtn" type="submit">Send admin sign-in code</button></form><p id="adminMsg" class="msg"></p><a class="link" href="/student-login.html">← Student Login</a></main><script>(()=>{const A=window.hatchable?.auth,form=document.getElementById('adminForm'),email=document.getElementById('adminEmail'),code=document.getElementById('adminCode'),btn=document.getElementById('adminBtn'),msg=document.getElementById('adminMsg');let step='email';if(!A){msg.textContent='Authentication is unavailable. Please refresh.';return}form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='';try{if(step==='email'){await A.startLogin({email:email.value.trim()});step='code';code.hidden=false;btn.textContent='Verify admin code';msg.textContent='Code sent! Check the administrator email.';code.focus()}else{const result=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(!result?.user)throw Error('Invalid or expired code. Please try again.');location.replace('/admin/')}}catch(err){msg.textContent=err?.message||'Unable to sign in. Please try again.'}finally{btn.disabled=false}})})()</script></body></html>
