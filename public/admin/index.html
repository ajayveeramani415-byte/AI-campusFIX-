<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — CampusFix AI</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}header{background:#101b36;color:#fff;padding:20px 6%;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:25px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 5px 22px #0001}.stat b{display:block;font-size:27px}.item{padding:16px 0;border-bottom:1px solid #e5e9f0}select,button,textarea{padding:10px;border-radius:9px;border:1px solid #d5dce8;font:inherit}button{background:#2563eb;color:#fff;border:0;font-weight:700}.pill{padding:4px 8px;background:#edf2ff;border-radius:20px;font-size:12px;margin-right:5px}.img{max-width:180px;max-height:130px;border-radius:10px;margin-top:8px}@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}}</style><header><b>CampusFix AI · Admin</b><button id="out">Sign out</button></header><main class="wrap"><div id="msg"></div><div class="stats"><div class="card stat">Total<b id="t">—</b></div><div class="card stat">Pending<b id="p">—</b></div><div class="card stat">In Progress<b id="i">—</b></div><div class="card stat">Resolved<b id="r">—</b></div></div><section class="card" style="margin-top:18px"><h2>Complaint Management</h2><div id="list">Loading…</div></section></main><script>const API=window.__HATCHABLE__.api,$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const q=await fetch(API+'/admin/complaints');if(q.status===403){msg.textContent='Access denied. This dashboard is administrator-only.';return}if(q.status===401){location.href='/admin-login.html';return}const x=await q.json();t.textContent=x.length;p.textContent=x.filter(c=>c.status==='Pending').length;i.textContent=x.filter(c=>c.status==='In Progress').length;r.textContent=x.filter(c=>c.status==='Resolved').length;list.innerHTML=x.map(c=>'<article class="item"><b>'+esc(c.title)+'</b><div>'+esc(c.location)+' · '+esc(c.department)+' · Reporter: '+esc(c.reporter_id)+'</div><p>'+esc(c.description)+'</p><span class="pill">'+esc(c.category)+'</span><span class="pill">'+esc(c.priority)+'</span><select onchange="update(\''+c.id+'\',this.value)"><option>Pending</option><option>In Progress</option><option>Resolved</option><option>Rejected</option></select>'+(c.image_url?'<br><img class="img" src="'+esc(c.image_url)+'">':'')+'</article>').join('')||'No complaints.'}async function update(id,status){const note=prompt('Update / resolution note:')||'';await fetch(API+'/admin/complaints',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status,note})});load()}out.onclick=async()=>{await window.hatchable.auth.signOut();location.href='/admin-login.html'};load()</script>
