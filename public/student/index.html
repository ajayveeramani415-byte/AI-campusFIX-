<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal — CampusFix AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f7fb;color:#172033}header{background:#2563eb;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1050px;margin:25px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 24px #0001}input,textarea,button{width:100%;padding:12px;margin-top:10px;border:1px solid #d7deea;border-radius:10px;font:inherit}textarea{min-height:110px;resize:vertical}button{background:#2563eb;color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#64748b}.msg{min-height:24px;color:#475569}.item{padding:15px 0;border-bottom:1px solid #e5e9f0}.pill{display:inline-block;padding:4px 9px;background:#edf2ff;border-radius:20px;font-size:12px;margin:5px 5px 0 0}.status{font-weight:700}.img{max-width:180px;max-height:130px;border-radius:10px;margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>🎓 CampusFix AI · Student Portal</b><button id="out" style="width:auto;margin:0;padding:9px 15px;background:#fff;color:#2563eb">Sign out</button></header><main class="wrap"><div class="grid"><section class="card"><h2>Report a Campus Problem</h2><p>Describe the issue. AI will classify the category, priority and department automatically.</p><div id="aiFlow" style="display:none;margin:15px 0;padding:14px;background:#f8fafc;border-radius:12px"><b>🤖 AI Processing</b><div id="flowText" style="margin-top:8px;color:#475569">Analyzing title + description + location…</div></div><form id="form"><input id="title" placeholder="Complaint title" required><textarea id="description" placeholder="Describe the problem in detail..." required></textarea><input id="location" placeholder="Location (e.g. CSE Lab 2)" required><input id="photo" type="file" accept="image/*"><button id="submit">🤖 Analyze & Submit</button></form><p id="msg" class="msg"></p></section><section class="card"><h2>My Complaints</h2><div id="list">Loading…</div></section></div></main><script>const API=window.__HATCHABLE__.api,$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const q=await fetch(API+'/complaints');if(q.status===401){location.href='/student-login.html';return}const x=await q.json();$('list').innerHTML=x.map(c=>'<article class="item"><b>'+esc(c.title)+'</b><div>'+esc(c.location)+'</div><p>'+esc(c.description)+'</p><span class="pill">'+esc(c.category)+'</span><span class="pill">'+esc(c.priority)+'</span><span class="pill">'+esc(c.department)+'</span><div class="status">Status: '+esc(c.status)+'</div>'+(c.image_url?'<img class="img" src="'+esc(c.image_url)+'">':'')+'<small> '+new Date(c.created_at).toLocaleString()+'</small></article>').join('')||'No complaints submitted yet.'}$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('msg').textContent='';$('aiFlow').style.display='block';$('flowText').textContent='1. AI analyzes title + description + location…';try{const r=await fetch(API+'/complaints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value.trim(),description:$('description').value.trim(),location:$('location').value.trim()})});const data=await r.json();if(!r.ok)throw Error(data.error||'Could not submit complaint');$('flowText').textContent='2. Category: '+data.category+'  •  3. Priority: '+data.priority+'  •  4. Department: '+data.department;const file=$('photo').files[0];if(file){const fd=new FormData();fd.append('file',file);const u=await fetch(API+'/complaints/upload?complaint_id='+encodeURIComponent(data.id),{method:'POST',body:fd});if(!u.ok)throw Error('Complaint saved, but photo upload failed.');if(u.ok){const ud=await u.json();if(ud.image_analysis)$('flowText').textContent='5. Image AI analysis completed • '+String(ud.image_analysis).slice(0,180)}}$('form').reset();$('flowText').textContent='6. Sent to Admin Dashboard → 7. Staff resolves the problem';$('msg').textContent=data.is_duplicate?'Complaint submitted. AI detected a possible duplicate complaint.':'Complaint submitted successfully!';load()}catch(err){$('msg').textContent=err.message||'Submission failed.'}finally{$('submit').disabled=false}});$('out').onclick=async()=>{await window.hatchable.auth.signOut();location.href='/student-login.html'};async function loadNotifications(){const q=await fetch(API+'/notifications');if(q.status!==200)return;const x=await q.json();if(x.length){const n=document.createElement('div');n.className='card';n.style.marginTop='20px';n.innerHTML='<h2>🔔 Notifications</h2>'+x.slice(0,5).map(v=>'<div class="item"><b>'+esc(v.title)+'</b><p>'+esc(v.message)+'</p><small>'+new Date(v.created_at).toLocaleString()+'</small></div>').join('');document.querySelector('.wrap').appendChild(n)}}load();loadNotifications();</script></body></html>
