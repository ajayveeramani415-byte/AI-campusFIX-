<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusFix AI — Sign in</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:system-ui;color:#172033}.box{width:min(380px,90%);background:white;padding:32px;border-radius:20px;box-shadow:0 12px 40px #17203318}h1{margin:0 0 8px}p{color:#64748b}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:12px;border-radius:10px;font:inherit}input{border:1px solid #d8deea}button{border:0;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.ghost{background:#eef2ff;color:#243b76}.msg{min-height:20px;font-size:14px}</style></head><body><main class="box"><h1>CampusFix AI</h1><p>Sign in to report and track college problems.</p><form id="f"><input id="email" type="email" autocomplete="username webauthn" placeholder="College email" required><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" hidden><button id="submit">Send sign-in code</button></form><button id="back" class="ghost" hidden>Use another email</button><p id="msg" class="msg"></p></main><script>const A=window.hatchable.auth,f=document.querySelector('#f'),email=document.querySelector('#email'),code=document.querySelector('#code'),submit=document.querySelector('#submit'),back=document.querySelector('#back'),msg=document.querySelector('#msg');let step=0;const next=()=>{const n=new URLSearchParams(location.search).get('next');return n&&n[0]=='/'&&!n.startsWith('//')?n:'/'};A.getSession().then(s=>{if(s&&s.user)location.replace(next())});f.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{if(!step){await A.startLogin({email:email.value.trim()});step=1;code.hidden=false;back.hidden=false;submit.textContent='Sign in';msg.textContent='Code sent to '+email.value.trim();code.focus()}else{await A.verifyCode({email:email.value.trim(),code:code.value.trim()});location.replace(next())}}catch(x){msg.textContent=x.message||'Sign-in failed'}finally{submit.disabled=false}};back.onclick=()=>{step=0;code.hidden=true;back.hidden=true;submit.textContent='Send sign-in code';msg.textContent='';email.focus()};</script></body></html>
