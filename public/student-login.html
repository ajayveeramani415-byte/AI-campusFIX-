<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login — CampusFix AI</title><style>body{font-family:system-ui;background:#f4f7fb;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:32px;border-radius:20px;width:min(380px,88%);box-shadow:0 10px 35px #0001}input,button{width:100%;padding:13px;margin-top:12px;box-sizing:border-box;border-radius:10px;font:inherit}input{border:1px solid #ddd}button{border:0;background:#2563eb;color:#fff;font-weight:700}.link{display:block;text-align:center;margin-top:16px;color:#2563eb}.msg{min-height:20px;color:#475569}</style></head><body><main class="box"><h1>🎓 Student Login</h1><p>Enter your email to receive a one-time sign-in code.</p><form id="loginForm"><input id="emailInput" type="email" autocomplete="email" placeholder="Enter your email" required><input id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code" hidden><button id="submitBtn" type="submit">Send sign-in code</button></form><p id="message" class="msg"></p><a class="link" href="/admin-login.html">🔐 Administrator Login →</a></main><script>(()=>{const A=window.hatchable?.auth,form=document.getElementById('loginForm'),email=document.getElementById('emailInput'),code=document.getElementById('codeInput'),btn=document.getElementById('submitBtn'),msg=document.getElementById('message');let step='email';if(!A){msg.textContent='Authentication is unavailable. Please refresh.';return}form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='';try{if(step==='email'){const value=email.value.trim();if(!value)throw Error('Please enter your email.');await A.startLogin({email:value});step='code';code.hidden=false;btn.textContent='Verify code';msg.textContent='Code sent! Check your email.';code.focus()}else{const result=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(!result?.user)throw Error('Invalid or expired code. Please try again.');location.replace('/student/')}}catch(err){msg.textContent=err?.message||'Unable to sign in. Please try again.'}finally{btn.disabled=false}})})()</script></body></html>
